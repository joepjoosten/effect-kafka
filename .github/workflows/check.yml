name: Check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Build, types, tests, examples
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: python3 scripts/generate-saslprep-tables.py --check
      - run: pnpm build
      - run: pnpm check
      - run: pnpm test
      - run: pnpm check:examples
      - run: bash scripts/pack-smoke.sh
  integration:
    name: Kafka broker integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Start Kafka
        run: |
          docker run -d --name kafka -p 9092:9092 -p 9094:9094 \
            -v "$PWD/integration/server.properties:/mnt/shared/config/server.properties:ro" \
            --entrypoint /bin/bash apache/kafka:4.0.0 -c '
              /opt/kafka/bin/kafka-storage.sh format -t MkU3OEVBNTcwNTJENDM2Qk -c /mnt/shared/config/server.properties &&
              exec /opt/kafka/bin/kafka-server-start.sh /mnt/shared/config/server.properties'
          ready=false
          for attempt in $(seq 1 30); do
            if docker exec kafka /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list; then ready=true; break; fi
            sleep 2
          done
          if [ "$ready" != true ]; then docker logs kafka; exit 1; fi
          for mechanism in SCRAM-SHA-256 SCRAM-SHA-512; do
            docker exec kafka /opt/kafka/bin/kafka-configs.sh --bootstrap-server localhost:9092 \
              --alter --entity-type users --entity-name test \
              --add-config "$mechanism=[iterations=4096,password=test-secret]"
          done
      - run: pnpm test:integration
      - name: Broker logs
        if: failure()
        run: docker logs kafka
